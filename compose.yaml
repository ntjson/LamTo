services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lamto
      POSTGRES_USER: lamto_bootstrap
      POSTGRES_PASSWORD: lamto-bootstrap
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamto_bootstrap -d lamto"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./ops/postgres-init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro"
  minio:
    image: localstack/localstack:3.8.0
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: lamto-local
      AWS_SECRET_ACCESS_KEY: lamto-local-secret
      AWS_DEFAULT_REGION: us-east-1
    ports: ["127.0.0.1:4566:4566"]
    volumes: ["localstack-data:/var/lib/localstack"]
  minio-init:
    image: amazon/aws-cli:2.37.1
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: lamto-local
      AWS_SECRET_ACCESS_KEY: lamto-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >-
      /bin/sh -c "until aws --endpoint-url http://minio:4566 s3api head-bucket --bucket lamto-documents 2>/dev/null || aws --endpoint-url http://minio:4566 s3api create-bucket --bucket lamto-documents; do sleep 1; done;
      aws --endpoint-url http://minio:4566 s3api put-bucket-versioning --bucket lamto-documents --versioning-configuration Status=Enabled"
  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
volumes:
  postgres-data:
  localstack-data:
  clamav-data:
