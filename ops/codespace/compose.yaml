# The Codespaces demo: the trial stack (ops/trial/compose.yaml) with Caddy on
# plain HTTP port 80, which GitHub forwards as https://<codespace>-80.app.github.dev.
#
#   docker compose -f ops/trial/compose.yaml -f ops/codespace/compose.yaml up -d
#
# Only the Caddyfile mount changes; compose merges volumes by their target.

services:
  caddy:
    volumes:
      - ../codespace/Caddyfile:/etc/caddy/Caddyfile:ro
